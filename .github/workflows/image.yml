name: Image

# main에 머지되면 운영 이미지를 만들어 GitHub Container Registry에 올린다.
# 태그는 latest와 커밋 SHA다. 배포는 SHA 태그로 해서 어떤 커밋이 떠 있는지 알 수 있게 한다.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
