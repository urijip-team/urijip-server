# 스키마는 Flyway(db/migration)가 만든다. Hibernate는 엔티티와 맞는지만 본다.
spring:
  jpa:
    hibernate:
      ddl-auto: validate

jwt:
  secret: local-dev-secret-key-do-not-use-in-production-0123456789

aes:
  key: aHRBAJ/jQTME/l1zaBV/sKYyssjqgHbAKi65Oq0Np9o=

# compose.yaml의 LocalStack(S3 흉내). 버킷은 컨테이너가 뜰 때 만들어진다.
storage:
  s3:
    bucket: urijip-local
    region: ap-northeast-2
    endpoint: http://localhost:4566
    access-key: test
    secret-key: test

# 관리자 웹 개발 서버(Vite 5173, CRA 3000)
cors:
  allowed-origins: http://localhost:5173, http://localhost:3000

# 프로메테우스가 지표를 가져가는 /actuator/prometheus를 연다(compose.yaml의 monitoring 프로파일).
# 운영은 지표를 외부에 드러내지 않도록 열지 않는다.
management:
  endpoints:
    web:
      exposure:
        include: health, prometheus

# 콘솔은 사람이 읽는 형식 그대로 두고, 파일에는 JSON으로 남긴다. Alloy가 이 파일을 읽어 Loki로 보낸다.
logging:
  file:
    name: logs/urijip-server.log
  structured:
    format:
      file: logstash
