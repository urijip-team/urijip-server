# 스키마는 Flyway(db/migration)가 만든다. Hibernate는 엔티티와 맞는지만 본다.
spring:
  jpa:
    hibernate:
      ddl-auto: validate

jwt:
  secret: local-dev-secret-key-do-not-use-in-production-0123456789

aes:
  key: aHRBAJ/jQTME/l1zaBV/sKYyssjqgHbAKi65Oq0Np9o=

# compose.yaml의 LocalStack(S3 흉내). 버킷은 컨테이너가 뜰 때 만들어진다.
storage:
  s3:
    bucket: urijip-local
    region: ap-northeast-2
    endpoint: http://localhost:4566
