spring:
  jpa:
    hibernate:
      ddl-auto: validate

jwt:
  secret: ${JWT_SECRET}

aes:
  key: ${AES_KEY}

# 자격 증명은 AWS 기본 방식(IAM 역할, AWS_ACCESS_KEY_ID 등 환경변수)으로 얻는다.
push:
  fcm:
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:}

# 관리자 웹 주소. 여러 개면 쉼표로 구분한다. 예: https://admin.urijip.com
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

storage:
  s3:
    bucket: ${S3_BUCKET}
    region: ${AWS_REGION:ap-northeast-2}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
