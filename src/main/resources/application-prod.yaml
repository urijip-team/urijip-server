spring:
  jpa:
    hibernate:
      ddl-auto: validate

jwt:
  secret: ${JWT_SECRET}

aes:
  key: ${AES_KEY}

# 자격 증명은 AWS 기본 방식(IAM 역할, AWS_ACCESS_KEY_ID 등 환경변수)으로 얻는다.
push:
  fcm:
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:}

# 관리자 웹 주소. 여러 개면 쉼표로 구분한다. 예: https://admin.urijip.com
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

storage:
  s3:
    bucket: ${S3_BUCKET}
    region: ${AWS_REGION:ap-northeast-2}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# 지표(/actuator/*)는 8081에서만 연다. 컨테이너는 8080만 호스트에 내보내므로 로드 밸런서로는 지표에 닿지 않고,
# 같은 Docker 네트워크의 프로메테우스만 urijip-server:8081로 가져간다(deploy/monitoring).
# 로드 밸런서와 deploy.sh의 상태 확인은 8080의 /readyz를 쓴다.
management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      probes:
        add-additional-paths: true

# 컨테이너 로그(콘솔)를 JSON으로 남긴다. Alloy가 Docker에서 읽어 Loki로 보낸다.
logging:
  structured:
    format:
      console: logstash
