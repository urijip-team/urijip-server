spring:
  jpa:
    hibernate:
      ddl-auto: validate

jwt:
  secret: ${JWT_SECRET}

aes:
  key: ${AES_KEY}

# 자격 증명은 AWS 기본 방식(IAM 역할, AWS_ACCESS_KEY_ID 등 환경변수)으로 얻는다.
storage:
  s3:
    bucket: ${S3_BUCKET}
    region: ${AWS_REGION:ap-northeast-2}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
