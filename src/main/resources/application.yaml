spring:
  application:
    name: urijip-server
  profiles:
    default: local
  # 인증은 JWT 필터가 한다. 쓰지 않는 기본 로그인 계정이 만들어져 비밀번호가 로그에 찍히지 않게 끈다.
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/urijip}
    username: ${DB_USERNAME:urijip}
    password: ${DB_PASSWORD:urijip}
  jpa:
    open-in-view: false
  flyway:
    # Flyway를 들이기 전에 Hibernate가 테이블을 만든 DB(로컬, 운영)는 V1을 이미 적용한 것으로 보고 다음부터 적용한다.
    # 빈 DB에는 V1부터 적용한다.
    baseline-on-migrate: true
    baseline-version: 1
  servlet:
    multipart:
      # 사진 업로드: 한 장 10MB, 한 번에 최대 10장
      max-file-size: 10MB
      max-request-size: 100MB

jwt:
  access-expiration: 30m
  refresh-expiration: 14d

storage:
  s3:
    url-expiration: 1h

management:
  metrics:
    # 그라파나에서 서버를 구분할 때 쓴다.
    tags:
      application: ${spring.application.name}
    # 응답 시간 p95·p99를 프로메테우스에서 계산할 수 있게 히스토그램으로 내보낸다.
    distribution:
      percentiles-histogram:
        http.server.requests: true
