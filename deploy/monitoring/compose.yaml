# EC2에서 서버(deploy.sh가 띄운 urijip-server 컨테이너)의 지표와 로그를 모은다.
# 그라파나 데이터소스·대시보드는 로컬과 같은 파일(docker/monitoring/grafana)을 쓴다.
#
#   docker compose --env-file /etc/urijip/monitoring.env up -d
#
# 그라파나는 EC2 안(127.0.0.1:3000)에만 열린다. SSH 터널로 접속한다(deploy/README.md).
name: urijip-monitoring

services:
  prometheus:
    image: 'prom/prometheus:v3.5.0'
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    restart: unless-stopped
    mem_limit: 300m
    volumes:
      - './prometheus.yml:/etc/prometheus/prometheus.yml:ro'
      - 'prometheus-data:/prometheus'
  loki:
    image: 'grafana/loki:3.5.3'
    command: ['-config.file=/etc/loki/loki.yaml']
    restart: unless-stopped
    mem_limit: 300m
    volumes:
      - './loki.yaml:/etc/loki/loki.yaml:ro'
      - 'loki-data:/loki'
  alloy:
    # Docker에서 urijip-server 컨테이너의 로그(JSON)를 읽어 Loki로 보낸다.
    image: 'grafana/alloy:v1.10.0'
    command: ['run', '--storage.path=/var/lib/alloy/data', '/etc/alloy/config.alloy']
    restart: unless-stopped
    mem_limit: 200m
    volumes:
      - './config.alloy:/etc/alloy/config.alloy:ro'
      - '/var/run/docker.sock:/var/run/docker.sock:ro'
      - 'alloy-data:/var/lib/alloy/data'
    depends_on:
      - loki
  grafana:
    image: 'grafana/grafana:12.1.0'
    restart: unless-stopped
    mem_limit: 300m
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      - 'GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?/etc/urijip/monitoring.env에 GRAFANA_ADMIN_PASSWORD를 넣는다}'
      - 'GF_USERS_ALLOW_SIGN_UP=false'
    volumes:
      - '../../docker/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro'
      - '../../docker/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro'
      - 'grafana-data:/var/lib/grafana'
    depends_on:
      - prometheus
      - loki

# deploy.sh가 만드는 네트워크. 서버 컨테이너가 urijip-server라는 이름으로 보인다.
networks:
  default:
    name: urijip
    external: true

volumes:
  prometheus-data:
  loki-data:
  alloy-data:
  grafana-data:
