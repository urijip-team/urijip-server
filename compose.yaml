services:
  mysql:
    image: 'mysql:8.4'
    environment:
      - 'MYSQL_DATABASE=urijip'
      - 'MYSQL_USER=urijip'
      - 'MYSQL_PASSWORD=urijip'
      - 'MYSQL_ROOT_PASSWORD=root'
      - 'TZ=Asia/Seoul'
    ports:
      - '3306:3306'
    volumes:
      - 'mysql-data:/var/lib/mysql'
  localstack:
    # S3 대신 쓴다. 2026.x부터는 인증 토큰이 있어야 실행되므로, 토큰 없이 쓸 수 있는 마지막 버전으로 고정한다.
    image: 'localstack/localstack:4.14.0'
    environment:
      - 'SERVICES=s3'
    ports:
      - '4566:4566'
    volumes:
      - './docker/localstack/init-s3.sh:/etc/localstack/init/ready.d/init-s3.sh:ro'

  # 아래는 모니터링(지표·로그). bootRun은 띄우지 않으므로 필요할 때 따로 띄운다.
  #   docker compose --profile monitoring up -d
  prometheus:
    image: 'prom/prometheus:v3.5.0'
    profiles: ['monitoring']
    ports:
      - '9090:9090'
    # bootRun으로 호스트에서 도는 서버(8080)에 접속하기 위해. Docker Desktop이 아닌 Linux에서도 되게 한다.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - './docker/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro'
      - 'prometheus-data:/prometheus'
  loki:
    image: 'grafana/loki:3.5.3'
    profiles: ['monitoring']
    ports:
      - '3100:3100'
    volumes:
      - 'loki-data:/loki'
  alloy:
    # logs/urijip-server.log(JSON)를 읽어 Loki로 보낸다.
    image: 'grafana/alloy:v1.10.0'
    profiles: ['monitoring']
    command: ['run', '--server.http.listen-addr=0.0.0.0:12345', '--storage.path=/var/lib/alloy/data', '/etc/alloy/config.alloy']
    ports:
      - '12345:12345'
    volumes:
      - './docker/monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro'
      - './logs:/var/log/urijip:ro'
      - 'alloy-data:/var/lib/alloy/data'
    depends_on:
      - loki
  grafana:
    image: 'grafana/grafana:12.1.0'
    profiles: ['monitoring']
    # 3000은 관리자 웹 개발 서버(CRA)가 쓸 수 있어 3001로 연다.
    ports:
      - '3001:3000'
    environment:
      # 로컬 전용이라 로그인 없이 관리자로 들어간다.
      - 'GF_AUTH_ANONYMOUS_ENABLED=true'
      - 'GF_AUTH_ANONYMOUS_ORG_ROLE=Admin'
      - 'GF_AUTH_DISABLE_LOGIN_FORM=true'
    volumes:
      - './docker/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro'
      - './docker/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro'
      - 'grafana-data:/var/lib/grafana'
    depends_on:
      - prometheus
      - loki

volumes:
  mysql-data:
  prometheus-data:
  loki-data:
  alloy-data:
  grafana-data:
